  <style>
    :root{
      --bg: #f7f8fb;
      --card: #ffffff;
      --muted: #55606a;
      --accent: #0b64c9;
      --radius: 12px;
      --maxw: 900px;
      --pad: 20px;
      font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
    }

    html,body{height:100%;}
    body{
      margin:0;
      background:var(--bg);
      color:#17202a;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      font-size:16px;
      line-height:1.6;
    }

    /* Navbar */
    header{
      background:#333;
      color:#fff;
      padding:15px 20px;
    }

    header nav{
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    header nav a{
      color:#fff;
      text-decoration:none;
      margin:0 15px;
      font-weight:bold;
      transition:color 0.2s;
    }

    header nav a:hover{color:rgb(216,240,81);}

    header .logo img{height:90px;width:auto;}

    .container{
      width:100%;
      max-width:var(--maxw);
      
      padding:calc(var(--pad) * 1.2);
      box-sizing:border-box;
      margin:40px auto;
    }
    .container h1{
      font-size: 40px;
    }

    .cards {
  display: block;     /* remove grid layout */
  gap: 0;             /* no spacing needed */
}

.card, .card1 {
  background: none;   /* remove background box */
  border: none;       /* remove border radius */
  box-shadow: none;   /* remove shadow */
  padding: 0;         /* remove padding */
  margin: 50px 0;     /* just add simple spacing */
  width: 100%;    /* take full width */
}

.card h2, .card1 h2 {
  margin: 20px 0 10px 0;
  font-size: 30px;
  color: rgb(139, 154, 50);   /* optional: keep a nice highlight */
}

.card p, .card1 p {
  margin: 0 0 15px 0;
  color: #333;      /* normal text color */
  font-size: 20px;
}


    @media (max-width:720px){
      .cards{grid-template-columns:1fr}
      .container{padding:16px;margin:20px auto}
      header nav{flex-direction:column;gap:10px;padding:12px}
    }
  </style>
  <main class="container" role="main">
    <h1>ARCSCU KEYNOTE SPEECHES </h1>

      <article class="card">
        <h2>My KeyNote</h2>
      </article>
